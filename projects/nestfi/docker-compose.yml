version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nestfi_postgres
    environment:
      POSTGRES_USER: nestfi
      POSTGRES_PASSWORD: nestfi_password
      POSTGRES_DB: nestfi
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestfi -d nestfi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nestfi_backend
    environment:
      DATABASE_URL: postgresql://nestfi:nestfi_password@postgres:5432/nestfi
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      API_BASE_URL: http://localhost:8100
      FRONTEND_URL: http://localhost:3100
      DEBUG: ${DEBUG:-False}
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8100/api/v1
    container_name: nestfi_frontend
    environment:
      DEBUG: ${DEBUG:-False}
    ports:
      - "3100:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    name: nestfi_network
