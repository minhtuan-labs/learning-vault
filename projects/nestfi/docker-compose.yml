version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nestfi_postgres
    environment:
      POSTGRES_USER: nestfi
      POSTGRES_PASSWORD: nestfi_password
      POSTGRES_DB: nestfi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestfi -d nestfi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nestfi_backend
    environment:
      DATABASE_URL: postgresql://nestfi:nestfi_password@postgres:5432/nestfi
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@nestfi.local}
      API_BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8050
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: nestfi_frontend
    environment:
      API_BASE_URL: http://backend:8000
      DEBUG: ${DEBUG:-False}
    ports:
      - "8050:8050"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: python app/main.py

volumes:
  postgres_data:

networks:
  default:
    name: nestfi_network
